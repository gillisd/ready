name: CI

on:
  push:
    branches: [main, master, e2e-rspec]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.4.7', '4.0.1']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Run specs
      run: bundle exec rake spec
    - name: Run RuboCop
      run: bundle exec rake rubocop

  e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.4.7', '4.0.1']
    steps:
    - uses: actions/checkout@v4
    - name: Install zsh
      run: sudo apt-get update && sudo apt-get install -y zsh
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Run E2E specs
      run: bundle exec rake spec:e2e

  # macOS is where the harness actually runs for users (zsh is the default
  # shell, executables resolve through rbenv). This job reproduces the
  # process-hang/leak reports on a real Mac and fails loudly if the harness
  # leaves any by-server or sandbox process behind.
  macos-e2e:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Cache the rbenv-built Ruby (first run compiles it, later runs restore)
      uses: actions/cache@v4
      with:
        path: ~/.rbenv/versions
        key: rbenv-versions-4.0.1-${{ runner.os }}
    - name: Install rbenv + Ruby 4.0.1 (matches a real user's setup)
      run: |
        brew install rbenv ruby-build coreutils
        rbenv versions --bare | grep -qx 4.0.1 || rbenv install 4.0.1
        rbenv global 4.0.1
        echo "$HOME/.rbenv/shims" >> "$GITHUB_PATH"
    - name: Bundle
      run: |
        gem install bundler
        bundle install
    # Each e2e spec runs alone under a short timeout so a hang is pinned to one
    # spec (gtimeout exit 124) instead of one opaque 15-minute black box. The
    # `; echo` keeps a hung probe from failing the step, so every probe runs.
    - name: Probe 1 -- basic pty marker sync (no server, no rbenv)
      run: |
        gtimeout -s KILL 90 env READY_E2E=1 bundle exec rspec spec/e2e/pty_shell_spec.rb 2>&1; echo "PTY_SHELL exit: $?"
    - name: Probe 2 -- hot dispatch through the plugin + by-server
      run: |
        gtimeout -s KILL 180 env READY_E2E=1 bundle exec rspec spec/e2e/dispatch_spec.rb 2>&1; echo "DISPATCH exit: $?"
    - name: Probe 3a -- benchmark as-is (reproduces the hang)
      run: |
        gtimeout -s KILL 90 env READY_E2E=1 bundle exec rspec spec/e2e/benchmark_spec.rb 2>&1; echo "BENCH_WITH_PAGER exit: $?"
    - name: Probe 3b -- benchmark with the pager neutralized (hypothesis test)
      run: |
        gtimeout -s KILL 120 env READY_E2E=1 RI_PAGER=cat PAGER=cat bundle exec rspec spec/e2e/benchmark_spec.rb 2>&1; echo "BENCH_NO_PAGER exit: $?"
    - name: Detect leaked processes
      if: always()
      run: |
        echo "=== surviving by-server ==="; pgrep -fl by-server || echo none
        echo "=== surviving ready-e2e ==="; pgrep -fl ready-e2e || echo none
        echo "leaked: $(pgrep -f 'by-server|ready-e2e' | wc -l | tr -d ' ')"
