name: CI

on:
  push:
    branches: [main, master, e2e-rspec]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.4.7', '4.0.1']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Run specs
      run: bundle exec rake spec
    - name: Run RuboCop
      run: bundle exec rake rubocop

  e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.4.7', '4.0.1']
    steps:
    - uses: actions/checkout@v4
    - name: Install zsh
      run: sudo apt-get update && sudo apt-get install -y zsh
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Run E2E specs
      run: bundle exec rake spec:e2e

  # macOS is where the harness actually runs for users (zsh is the default
  # shell, executables resolve through rbenv). This job reproduces the
  # process-hang/leak reports on a real Mac and fails loudly if the harness
  # leaves any by-server or sandbox process behind.
  macos-e2e:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Cache the rbenv-built Ruby (first run compiles it, later runs restore)
      uses: actions/cache@v4
      with:
        path: ~/.rbenv/versions
        key: rbenv-versions-4.0.1-${{ runner.os }}
    - name: Install rbenv + Ruby 4.0.1 (matches a real user's setup)
      run: |
        brew install rbenv ruby-build coreutils
        rbenv versions --bare | grep -qx 4.0.1 || rbenv install 4.0.1
        rbenv global 4.0.1
        echo "$HOME/.rbenv/shims" >> "$GITHUB_PATH"
    - name: Bundle
      run: |
        gem install bundler
        bundle install
    # set +e so a gtimeout-killed probe (exit 137) does not abort the step
    # under bash -e -- otherwise the failing probe skips every later probe.
    # Each probe runs alone so a hang is pinned to it. 0 = passed, 137 = hung.
    - name: Probe 1 -- basic pty marker sync
      run: |
        set +e
        gtimeout -s KILL 90 env READY_E2E=1 bundle exec rspec spec/e2e/pty_shell_spec.rb 2>&1
        echo "PROBE1_PTY exit: $?"
    - name: Probe 2 -- hot dispatch through the plugin + by-server
      run: |
        set +e
        gtimeout -s KILL 180 env READY_E2E=1 bundle exec rspec spec/e2e/dispatch_spec.rb 2>&1
        echo "PROBE2_DISPATCH exit: $?"
    - name: Probe 3a -- rake bench, ri TCPServer (ri pages its output)
      run: |
        set +e
        gtimeout -s KILL 90 bundle exec rake bench BENCH_EXE=ri BENCH_ARGS=TCPServer BENCH_RUNS=2 BENCH_WARMUPS=1 2>&1
        echo "PROBE3A_RI_PAGER exit: $?"
    - name: Probe 3b -- rake bench, irb --version (does not page)
      run: |
        set +e
        gtimeout -s KILL 90 bundle exec rake bench BENCH_EXE=irb BENCH_ARGS=--version BENCH_RUNS=2 BENCH_WARMUPS=1 2>&1
        echo "PROBE3B_IRB exit: $?"
    - name: Probe 3c -- rake bench, ri TCPServer with the pager neutralized
      run: |
        set +e
        RI_PAGER=cat PAGER=cat GIT_PAGER=cat gtimeout -s KILL 90 bundle exec rake bench BENCH_EXE=ri BENCH_ARGS=TCPServer BENCH_RUNS=2 BENCH_WARMUPS=1 2>&1
        echo "PROBE3C_RI_NOPAGER exit: $?"
    - name: Detect leaked processes
      if: always()
      run: |
        echo "=== surviving by-server ==="; pgrep -fl by-server || echo none
        echo "=== surviving ready-e2e ==="; pgrep -fl ready-e2e || echo none
        echo "leaked: $(pgrep -f 'by-server|ready-e2e' | wc -l | tr -d ' ')"
