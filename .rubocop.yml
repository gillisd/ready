# ===========================================================================
# RuboCop Configuration
#
# Base: Stock RuboCop defaults
# AI guardrails: rubocop-claude plugin (all Claude/ cops + stricter metrics)
# Performance: rubocop-performance (with chain-hostile cops disabled)
#
# Philosophy: idiomatic Ruby, pipeline-style chaining, strict for AI agents,
# readable for humans.
# ===========================================================================

plugins:
  - rubocop-claude
  - rubocop-rspec
  - rubocop-performance
  - rubocop-rake

AllCops:
  NewCops: enable
  # Lint at the gem's supported floor (ready.gemspec's required_ruby_version),
  # which CI also exercises -- not the 4.0.1 dev pin -- so accidental
  # 4.0-only syntax is caught rather than shipped to 3.4 users.
  TargetRubyVersion: 3.4
  Exclude:
    # Stock bundler scripts; bin/bench is ours and stays linted.
    - bin/console
    - bin/setup
    - vendor/**/*
    # Vendored read-only reference copy of an external gem; not this project's
    # code (it is also gitignored, so CI never sees it).
    - references/**/*
    # Standalone runtime helper scripts -- a doc formatter and the rdoc `ri`
    # patch -- with their own conventions, not the gem's authored library code.
    - extra/**/*
    - lib/core_ext/**/*
    - rakelib/project.rb
    - rakelib/project_version.rb
    - rakelib/version_tag.rb
    - rakelib/github_release.rb
    - rakelib/strict_shell.rb

# ===========================================================================
# Overrides from stock — personal style preferences
# ===========================================================================

# Double quotes everywhere. One less decision to make.
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Frozen string literal is transitional cruft. Ruby 3.4 has chilled strings,
# full default freeze is coming in a future Ruby.
Style/FrozenStringLiteralComment:
  EnforcedStyle: never

# Pipeline style. Chaining multi-line blocks is the whole point.
Style/MultilineBlockChain:
  Enabled: false

# Block delimiters are a taste call. Pipeline code uses braces for chaining,
# do/end for side effects. No cop captures this nuance.
Style/BlockDelimiters:
  Enabled: false

# Write arrays like arrays.
Style/WordArray:
  Enabled: false

Style/SymbolArray:
  Enabled: false

# Argument indentation: consistent 2-space indent, not aligned to first arg.
Layout/FirstArgumentIndentation:
  EnforcedStyle: consistent

# Dot-aligned chaining. Dots form a visual column.
Layout/MultilineMethodCallIndentation:
  EnforcedStyle: aligned

# ===========================================================================
# Overrides from rubocop-claude — loosen where pipeline style conflicts
# ===========================================================================

Claude/NoOverlyDefensiveCode:
  MaxSafeNavigationChain: 2

Style/SafeNavigation:
  MaxChainLength: 2

# Allow `return a, b` for tuple-style returns.
Style/RedundantReturn:
  AllowMultipleReturnValues: true

# ===========================================================================
# Overrides from rubocop-performance — disable chain-hostile cops
# ===========================================================================

Performance/ChainArrayAllocation:
  Enabled: false

Performance/MapMethodChain:
  Enabled: false

# ===========================================================================
# Additional tightening — not set by stock or rubocop-claude
# ===========================================================================

# Short blocks push toward small chained steps instead of fat lambdas.
Metrics/BlockLength:
  Max: 8
  CountAsOne:
    - array
    - hash
    - heredoc
    - method_call
  AllowedMethods:
    - command
    - describe
    - context
    - shared_examples
    - shared_examples_for
    - shared_context
  Exclude:
    - "ready.gemspec"
    - "rakelib/**/*"

# Gemspec and rake files use patterns that trigger Claude cops legitimately.
Claude/NoFancyUnicode:
  Exclude:
    - "ready.gemspec"

Claude/MysteryRegex:
  Exclude:
    - "rakelib/**/*"

# Zeitwerk loaders are mutable by design — only flag literal mutable values.
Style/MutableConstant:
  EnforcedStyle: literals

# Data.define subclassing keeps the class body a real class body, so constants
# holding instances of the class (e.g. Span::TABLE) live where they belong;
# the block form would bind them lexically to the enclosing namespace.
Style/DataInheritance:
  Enabled: false

# Shared test contexts legitimately define many helpers.
RSpec/MultipleMemoizedHelpers:
  Max: 10

# Anonymous forwarding (*, **, &) breaks TruffleRuby, JRuby, and
# Ruby < 3.2. Named args are explicit and portable.
Style/ArgumentsForwarding:
  Enabled: false

# Explicit begin/rescue/end is clearer than implicit method-body rescue.
Style/RedundantBegin:
  Enabled: false

# Compact class names are fine for small files and tests.
Style/ClassAndModuleChildren:
  Enabled: false

# Classes get rdoc.
Style/Documentation:
  Enabled: true
  Exclude:
    - "spec/**/*"

# E2E specs share one expensive by-server across examples via before(:all) and
# hold it in an instance variable; that is intentional here.
RSpec/BeforeAfterAll:
  Exclude:
    - "spec/e2e/**/*"

RSpec/InstanceVariable:
  Exclude:
    - "spec/e2e/**/*"

# E2E examples are longer by nature (shell/server setup + several aggregated
# structural assertions per example).
RSpec/ExampleLength:
  Exclude:
    - "spec/e2e/**/*"

# The e2e and benchmark suites are grouped by test type, not class namespace,
# so their paths deliberately do not mirror the described constant.
RSpec/SpecFilePathFormat:
  Exclude:
    - "spec/e2e/**/*"
    - "spec/bench/**/*"

# Ready::Bench::Report is a waterfall renderer whose job is to write to stdout;
# it lives under spec/support only so Zeitwerk autoloads it.
RSpec/Output:
  Exclude:
    - "spec/support/bench/**/*"

# Trailing commas in multiline literals and arguments.
Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: comma

# ===========================================================================
# RSpec — rubocop-rspec overrides
# ===========================================================================

# Not every describe block wraps a class.
RSpec/DescribeClass:
  Enabled: false

# Subject placement is a readability call, not a rule.
RSpec/LeadingSubject:
  Enabled: false

# Block style for expect { }.to change { } reads like a sentence.
RSpec/ExpectChange:
  EnforcedStyle: block

RSpec/NamedSubject:
  Enabled: false

# have_file_content matcher accepts a filename string in expect()
RSpec/ExpectActual:
  Enabled: false

Lint/EmptyInPattern:
  Enabled: false

Metrics/MethodLength:
  Exclude:
    - "**/*.rake"